name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            format: tar.gz
            has_3proxy: true
            3proxy_deb: 3proxy-0.9.6.x86_64.deb
          - goos: linux
            goarch: arm64
            format: tar.gz
            has_3proxy: true
            3proxy_deb: 3proxy-0.9.6.arm64.deb
          - goos: darwin
            goarch: amd64
            format: tar.gz
            has_3proxy: false
          - goos: darwin
            goarch: arm64
            format: tar.gz
            has_3proxy: false
          - goos: windows
            goarch: amd64
            format: zip
            has_3proxy: true
            3proxy_zip: 3proxy-0.9.6.1-x64.zip
          - goos: windows
            goarch: arm64
            format: zip
            has_3proxy: true
            3proxy_zip: 3proxy-0.9.6.1-arm64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          dir="rip-${GOOS}-${GOARCH}"
          mkdir -p "dist/$dir"
          go build -ldflags="-s -w" -o "dist/$dir/rip${ext}" ./cmd/cli

      - name: Download 3proxy
        if: matrix.has_3proxy
        run: |
          dir="dist/rip-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd "$dir"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            curl -sL "https://github.com/3proxy/3proxy/releases/download/0.9.6/${{ matrix.3proxy_deb }}" -o /tmp/3proxy.deb
            dpkg -x /tmp/3proxy.deb /tmp/3proxy-extract
            mv /tmp/3proxy-extract/usr/bin/3proxy ./3proxy
            chmod +x ./3proxy
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            curl -sL "https://github.com/3proxy/3proxy/releases/download/0.9.6/${{ matrix.3proxy_zip }}" -o /tmp/3proxy.zip
            unzip -o /tmp/3proxy.zip
            if [ -f "3proxy/bin64/3proxy.exe" ]; then
              mv "3proxy/bin64/3proxy.exe" ./3proxy.exe
            fi
            rm -rf 3proxy
          fi

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FORMAT: ${{ matrix.format }}
        run: |
          dir="rip-${GOOS}-${GOARCH}"
          if [ "$FORMAT" = "tar.gz" ]; then
            tar -czf "dist/${dir}.tar.gz" -C "dist" "$dir"
          else
            cd "dist" && zip -r "${dir}.zip" "$dir" && cd ..
          fi

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/rip-linux-amd64.tar.gz
            dist/rip-linux-arm64.tar.gz
            dist/rip-darwin-amd64.tar.gz
            dist/rip-darwin-arm64.tar.gz
            dist/rip-windows-amd64.zip
            dist/rip-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
